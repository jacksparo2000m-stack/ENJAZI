name: Build Android APK
on:
  push:
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare fixed ENJAZI signing key
        env:
          ENJAZI_KEYSTORE_BASE64: ${{ secrets.ENJAZI_KEYSTORE_BASE64 }}
          ENJAZI_STORE_PASSWORD: ${{ secrets.ENJAZI_STORE_PASSWORD }}
          ENJAZI_KEY_ALIAS: ${{ secrets.ENJAZI_KEY_ALIAS }}
          ENJAZI_KEY_PASSWORD: ${{ secrets.ENJAZI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ENJAZI_KEYSTORE_BASE64 ENJAZI_STORE_PASSWORD ENJAZI_KEY_ALIAS ENJAZI_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/enjazi-signing.p12"
          umask 077
          printf '%s' "$ENJAZI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass "$ENJAZI_STORE_PASSWORD" -alias "$ENJAZI_KEY_ALIAS" >/dev/null
          echo "ENJAZI_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Signing keystore loaded and alias verified."

      - name: Install dependencies and build Android app
        env:
          ENJAZI_KEYSTORE_PATH: ${{ runner.temp }}/enjazi-signing.p12
          ENJAZI_STORE_PASSWORD: ${{ secrets.ENJAZI_STORE_PASSWORD }}
          ENJAZI_KEY_ALIAS: ${{ secrets.ENJAZI_KEY_ALIAS }}
          ENJAZI_KEY_PASSWORD: ${{ secrets.ENJAZI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.${GITHUB_RUN_NUMBER}"
          export VERSION_CODE VERSION_NAME
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm install --no-audit --no-fund
          npm run build:native
          npx cap add android
          npx cap sync android
          python3 tools/install_native_notifications.py

          G=android/app/build.gradle
          test -f "$G"
          python3 - "$G" <<'PY'
          import os, re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]
          text, n_code = re.subn(r'(?m)^([ \t]*)versionCode[ \t]+[0-9]+', lambda m: m.group(1) + 'versionCode ' + version_code, text, count=1)
          text, n_name = re.subn(r'(?m)^([ \t]*)versionName[ \t]+"[^"]+"', lambda m: m.group(1) + 'versionName "' + version_name + '"', text, count=1)
          if n_code != 1 or n_name != 1:
              raise SystemExit("Could not set exactly one versionCode and versionName in generated app/build.gradle")
          if 'android {' not in text or 'buildTypes {' not in text:
              raise SystemExit("Generated app/build.gradle does not contain expected Groovy Android blocks")
          signing = '''
              signingConfigs {
                  enjazi {
                      storeFile file(System.getenv("ENJAZI_KEYSTORE_PATH"))
                      storePassword System.getenv("ENJAZI_STORE_PASSWORD")
                      keyAlias System.getenv("ENJAZI_KEY_ALIAS")
                      keyPassword System.getenv("ENJAZI_KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs {' in text:
              raise SystemExit("Unexpected existing signingConfigs block; refusing ambiguous signing configuration")
          text = text.replace('android {', 'android {\n' + signing, 1)
          match = re.search(r'(?m)^([ \t]*)buildTypes[ \t]*\{', text)
          if not match:
              raise SystemExit("Could not locate buildTypes block")
          indent = match.group(1) + '    '
          if re.search(r'(?m)^\s*debug\s*\{', text[match.end():]):
              raise SystemExit("A debug buildType already exists; refusing to add a duplicate")
          debug_block = '\n' + indent + 'debug {\n' + indent + '    signingConfig signingConfigs.enjazi\n' + indent + '}\n'
          text = text[:match.end()] + debug_block + text[match.end():]
          open(path, 'w', encoding="utf-8").write(text)
          print("Configured explicit ENJAZI signing for the debug APK.")
          PY

          grep -q "versionCode $VERSION_CODE" "$G"
          grep -q "versionName \"$VERSION_NAME\"" "$G"
          grep -q 'signingConfig signingConfigs.enjazi' "$G"

          A=android/app/src/main/assets
          cmp index.html "$A/public/index.html"
          cmp www/native.js "$A/public/native.js"

          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application#' "$M"
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' "$M"
          grep -q 'android.permission.WAKE_LOCK' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' "$M"

          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK identity and signing key
        env:
          ENJAZI_STORE_PASSWORD: ${{ secrets.ENJAZI_STORE_PASSWORD }}
          ENJAZI_KEY_ALIAS: ${{ secrets.ENJAZI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          EXPECTED_CERT="$(keytool -exportcert -alias "$ENJAZI_KEY_ALIAS" -keystore "$RUNNER_TEMP/enjazi-signing.p12" -storetype PKCS12 -storepass "$ENJAZI_STORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          if [ -z "$EXPECTED_CERT" ]; then
            echo "::error::Could not calculate expected signing certificate fingerprint"
            exit 1
          fi
          python3 tools/apk_identity.py "$APK" --package com.jacksparo.enjazi --cert "$EXPECTED_CERT" --min-version-code "$VERSION_CODE"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root environment variable is missing"
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK identity and signing verification passed."

      - name: Verify the APK contains the built web assets
        run: |
          set -euo pipefail
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/public/index.html | cmp - index.html
          unzip -p "$APK" assets/public/native.js | cmp - www/native.js

      - uses: actions/upload-artifact@v4
        with:
          name: enjazi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
