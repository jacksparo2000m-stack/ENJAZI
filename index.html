// ENJAZI WRITE AUDIT — independent, read-only with respect to app data
const AUDIT_DB='enjazi-write-audit',AUDIT_STORE='events';
let auditDbPromise=null;

function auditOpen(){
 if(auditDbPromise)return auditDbPromise;
 auditDbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(AUDIT_DB,1);
  req.onupgradeneeded=()=>{
   const db=req.result;
   if(!db.objectStoreNames.contains(AUDIT_STORE))
    db.createObjectStore(AUDIT_STORE,{keyPath:'id'});
  };
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('Audit DB open failed'));
 });
 return auditDbPromise;
}

function auditHash(raw){
 if(raw===null)return 'null';
 let h=2166136261;
 for(let i=0;i<raw.length;i++){
  h^=raw.charCodeAt(i);
  h=Math.imul(h,16777619);
 }
 return (h>>>0).toString(16).padStart(8,'0');
}

function auditTasks(raw){
 try{
  const data=JSON.parse(raw);
  return Array.isArray(data.tasks)?data.tasks.length:-1;
 }catch(e){return -1}
}

function auditRecord(event){
 try{
  auditOpen().then(db=>{
   const tx=db.transaction(AUDIT_STORE,'readwrite');
   const store=tx.objectStore(AUDIT_STORE);
   store.put({
    id:String(Date.now()).padStart(13,'0')+'-'+Math.random().toString(36).slice(2,8),
    at:Date.now(),
    ...event
   });
   const req=store.getAllKeys();
   req.onsuccess=()=>{
    const keys=(req.result||[]).sort();
    keys.slice(0,Math.max(0,keys.length-100))
     .forEach(key=>store.delete(key));
   };
  }).catch(e=>console.warn('ENJAZI audit unavailable:',e));
 }catch(e){}
}

async function auditList(){
 const db=await auditOpen();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(AUDIT_STORE,'readonly');
  const req=tx.objectStore(AUDIT_STORE).getAll();
  req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>b.at-a.at));
  req.onerror=()=>reject(req.error||new Error('Audit read failed'));
 });
}

function auditCapture(type,before,after,error){
 auditRecord({
  type,
  beforeTasks:auditTasks(before),
  afterTasks:auditTasks(after),
  beforeLength:before===null?-1:before.length,
  afterLength:after===null?-1:after.length,
  beforeHash:auditHash(before),
  afterHash:auditHash(after),
  error:error?String(error.message||error):'',
  stack:(new Error().stack||'').split('\n').slice(2,7).join(' | ')
 });
}

const auditStorage=Storage.prototype;
const auditOriginalSet=auditStorage.setItem;
const auditOriginalRemove=auditStorage.removeItem;
const auditOriginalClear=auditStorage.clear;

auditStorage.setItem=function(key,value){
 const tracked=this===window.localStorage&&String(key)===K;
 let before=null;
 if(tracked){try{before=this.getItem(K)}catch(e){}}
 try{
  const result=auditOriginalSet.call(this,key,value);
  if(tracked){
   let after=null;
   try{after=this.getItem(K)}catch(e){}
   auditCapture('setItem',before,after);
  }
  return result;
 }catch(e){
  if(tracked)auditCapture('setItem-error',before,before,e);
  throw e;
 }
};

auditStorage.removeItem=function(key){
 const tracked=this===window.localStorage&&String(key)===K;
 let before=null;
 if(tracked){try{before=this.getItem(K)}catch(e){}}
 const result=auditOriginalRemove.call(this,key);
 if(tracked)auditCapture('removeItem',before,null);
 return result;
};

auditStorage.clear=function(){
 const tracked=this===window.localStorage;
 let before=null;
 if(tracked){try{before=this.getItem(K)}catch(e){}}
 const result=auditOriginalClear.call(this);
 if(tracked)auditCapture('clear',before,null);
 return result;
};

const mig=(s)=>{let generated=0;

  g.it.forEach(i=>{if(!Array.isArray(i.ls)){const n=Number.isSafeInteger(i.done)&&i.done>=0?i.done:0;if(n>5000||generated+n>MAX_LECTURES)throw new Error('Legacy lecture count exceeds safe migration limit');generated+=n;i.ls=[];for(let k=1;k<=n;k++)i.ls.push({id:uid(),n:'محاضرة '+k,at:i.last||Date.now()})}
   i.ls.forEach(l=>{if(!l.id)l.id=uid();if(!Number.isFinite(l.at))l.at=Date.now()});

const BACKUP_DB='enjazi-data-protection',BACKUP_STORE='snapshots',BACKUP_LIMIT=10;
let backupDbPromise=null,saveQueue=Promise.resolve(),backupSequence=0,BOOTING=true;
const sortBackups=(a,b)=>b.createdAt-a.createdAt||String(b.id).localeCompare(String(a.id));
const backupHash=raw=>{let h=2166136261;for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
function backupDB(){if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB is unavailable'));if(backupDbPromise)return backupDbPromise;backupDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(BACKUP_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(BACKUP_STORE))db.createObjectStore(BACKUP_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>{backupDbPromise=null;reject(req.error||new Error('Could not open backup database'))};req.onblocked=()=>{backupDbPromise=null;reject(new Error('Backup database upgrade is blocked'))}});return backupDbPromise}

async function backupStore(raw,source='automatic'){
 if(typeof raw!=='string'||!raw)return false;
 const validSources=['automatic','pre-import','pre-restore','recovery','migration'];
 if(!validSources.includes(source))source='automatic';
 let data;
 try{data=JSON.parse(raw)}
 catch(e){throw new Error('Backup source is not valid JSON')}
 const invalid=vld(data);
 if(invalid)throw new Error('Backup source failed validation: '+invalid);
 const db=await backupDB();
 const id=String(Date.now()).padStart(13,'0')+'-'+String(++backupSequence).padStart(8,'0')+'-'+Math.random().toString(36).slice(2,8);
 const record={id,createdAt:Date.now(),schema:1,raw,checksum:backupHash(raw),source};
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(BACKUP_STORE,'readwrite');
  const store=tx.objectStore(BACKUP_STORE);
  const all=store.getAll();
  all.onsuccess=()=>{
   const rows=(all.result||[]).sort(sortBackups);
   const duplicate=rows.some(x=>x.checksum===record.checksum&&x.raw===raw);
   if(!duplicate){
    store.put(record);
    rows.concat(record).sort(sortBackups).slice(BACKUP_LIMIT).forEach(x=>store.delete(x.id));
   }
  };
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error||new Error('Backup transaction failed'));
  tx.onabort=()=>reject(tx.error||new Error('Backup transaction aborted'));
 });
 return true;
}

async function backupList(){const db=await backupDB();return new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE,'readonly'),req=tx.objectStore(BACKUP_STORE).getAll();req.onsuccess=()=>resolve((req.result||[]).sort(sortBackups));req.onerror=()=>reject(req.error||new Error('Could not read backups'))})}
async function restoreBackupRecord(record){return enqueueSaveOperation(async()=>{if(!record||typeof record.raw!=='string'||record.checksum!==backupHash(record.raw))throw new Error('Backup integrity check failed');const data=JSON.parse(record.raw),invalid=vld(data);if(invalid)throw new Error(invalid);const next=JSON.parse(JSON.stringify(data));mig(next);const postError=vld(next);if(postError)throw new Error(postError);const payload=JSON.stringify(next),currentRaw=localStorage.getItem(K);if(currentRaw!==null){const rawKey=K+'_pre_restore_'+Date.now();localStorage.setItem(rawKey,currentRaw);if(localStorage.getItem(rawKey)!==currentRaw)throw new Error('Pre-restore raw backup verification failed');try{if(currentRaw!==LAST_GOOD_RAW&&!vld(JSON.parse(currentRaw)))await backupStore(currentRaw,'pre-restore')}catch(e){console.warn('Current state was preserved as raw data but not added to validated snapshots:',e)}}if(LAST_GOOD_RAW&&LAST_GOOD_RAW!==payload&&LAST_GOOD_RAW!==currentRaw)await backupStore(LAST_GOOD_RAW,'pre-restore');localStorage.setItem(K,payload);if(localStorage.getItem(K)!==payload)throw new Error('Restored data verification failed');LAST_GOOD_RAW=payload;S=next;BOOT_RAW=payload;BOOT_DATA=next;RECOVERY=false;SAVE_FAILED=false;BOOT_ERROR='';BOOT_READ_FAILED=false;render();toast(T('تم استرجاع النسخة الاحتياطية بنجاح','Backup restored successfully'))});}
const enqueueSaveOperation=work=>{const result=saveQueue.then(work,work);saveQueue=result.then(()=>{},()=>{});return result};

const save=(scheduleNotifications=true)=>{
 if(RECOVERY)return Promise.resolve(false);
 const run=async()=>{
  if(RECOVERY)return false;
  let payload;
  try{
   payload=JSON.stringify(S);
  }catch(e){
   return false;
  }

  const previousRaw=LAST_GOOD_RAW;

  // Save the primary data first.
  try{
   localStorage.setItem(K,payload);
   if(localStorage.getItem(K)!==payload)
    throw new Error('Storage verification failed');

   SAVE_FAILED=false;
   LAST_GOOD_RAW=payload;
  }catch(e){
   SAVE_FAILED=true;
   console.error('ENJAZI primary save failed:',e);
   if(typeof toast==='function')
    toast(T('فشل حفظ البيانات؛ لم يتم تأكيد التغيير.','Data save failed; the change was not confirmed.'));
   if(previousRaw!==null&&JSON.stringify(S)===payload){
    try{S=JSON.parse(previousRaw)}catch(x){}
   }
   return false;
  }

  // Backup is secondary: its failure must not undo a verified save.
  if(previousRaw&&previousRaw!==payload){
   try{
    await backupStore(previousRaw);
   }catch(e){
    console.error('Primary save succeeded but backup failed:',e);
    if(typeof toast==='function')
     toast(T('تم حفظ المهمة، لكن تعذر تحديث النسخة الاحتياطية.','Task saved, but backup could not be updated.'));
   }
  }
  return true;
 };

  clearTimeout(save.t);
  save.t=ok&&scheduleNotifications?setTimeout(()=>window.sched&&sched(),300):null;
  return ok;
 });

  const prefix='AUDIT '+(index+1);

  Object.assign(candidate,DEFAULT_STATE(),JSON.parse(JSON.stringify(BOOT_DATA)));

  mig(candidate);
  trace('after migration',candidate);

  const secondError=vld(candidate);
  BOOT_TRACE.secondValidation=secondError||'valid';
  if(secondError){BOOT_ERROR=secondError;RECOVERY=true;return}

  S=candidate;
  trace('assigned to S',S);

  const migrated=JSON.stringify(candidate);
  trace('migration output',migrated);

  LAST_GOOD_RAW=BOOT_RAW;

  if(migrated!==BOOT_RAW){
   try{
    await backupStore(BOOT_RAW,'recovery');
    trace('before storage write',migrated);

    localStorage.setItem(K,migrated);

    if(localStorage.getItem(K)!==migrated)
     throw new Error('Migration storage verification failed');

    BOOT_RAW=migrated;
    LAST_GOOD_RAW=migrated;
   }catch(e){
    BOOT_ERROR='تم تحميل البيانات لكن تعذر حفظ ترحيلها: '+(e.message||e);
    RECOVERY=true;
   }
  }
 }catch(e){
  BOOT_ERROR='تعذر ترحيل البيانات بأمان: '+(e&&e.message||e);
  RECOVERY=true;
 }
}
