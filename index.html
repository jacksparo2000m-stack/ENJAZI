<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E7C86"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F3F6F8;--s:#fff;--tx:#14202B;--mu:#6B7886;--ac:#0E7C86;--ac2:#DDF1F3;--bd:#DFE5EA;--hi:#E5484D;--me:#C58B00;--lo:#2FA36B}
[data-th=dark]{--bg:#0E1419;--s:#17202A;--tx:#E8EEF3;--mu:#8D9BA8;--ac:#37B6C2;--ac2:#13343A;--bd:#263340}
[data-th=sepia]{--bg:#F1E8D4;--s:#FAF4E5;--tx:#3A3224;--mu:#7D705A;--ac:#8A5A2B;--ac2:#EBDDBF;--bd:#DCCFB2}
*{box-sizing:border-box;margin:0}html{font-size:16px}[data-fs=s]{font-size:14px}[data-fs=l]{font-size:19px}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:auto;padding:16px}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1{font-size:1.7rem}h2{font-size:1.1rem;flex:1}h3{font-size:.85rem;color:var(--mu);margin:16px 4px 6px}h3 span{opacity:.7}
.sub,.mu,small{color:var(--mu);font-size:.8rem}.card{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.row,.gh,.ih,.cmp{display:flex;align-items:center;gap:8px;justify-content:space-between}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.in,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--s);border-radius:20px;padding:6px 14px}
.chip.on,.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}.tabs{display:flex;gap:4px;margin-top:6px}.tabs button{flex:1;padding:8px 2px;border-radius:10px;font-size:.85rem}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0}
.task.dn .bd b{text-decoration:line-through;color:var(--mu)}.bd{flex:1;min-width:0}.bd p{color:var(--mu);font-size:.85rem;margin:2px 0}
.mt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--mu);margin-top:4px}.tag{color:var(--ac);font-weight:600}.ov{color:var(--hi)}
.ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--mu);flex:none;display:grid;place-items:center;font-size:.9rem}
.p3{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 15%,transparent)}.p2{border-color:var(--me);background:color-mix(in srgb,var(--me) 15%,transparent)}.p1{border-color:var(--lo);background:color-mix(in srgb,var(--lo) 15%,transparent)}
.dn .ck{background:var(--mu);color:#fff;border-color:var(--mu)}.ic{color:var(--mu);padding:4px}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-end:18px;width:56px;height:56px;border-radius:18px;background:var(--ac);color:#fff;font-size:1.8rem;box-shadow:0 6px 18px #0004;z-index:5}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--s);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:10px;display:flex;flex-direction:column;align-items:center;color:var(--mu);font-size:1.2rem}nav .on{color:var(--ac);font-weight:700}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:11px 16px}.btn.o{background:none;border:1px solid var(--bd);color:var(--tx)}.w{width:100%;margin:8px 0}
.it{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}.ia{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ia button{border:1px solid var(--bd);border-radius:10px;min-width:38px;padding:5px 10px}
.lnk{color:var(--ac);margin-top:8px}.empty{text-align:center;color:var(--mu);padding:40px 10px}
.sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}.sh[hidden],.ts[hidden]{display:none}
.bx{background:var(--bg);width:100%;max-width:640px;margin:auto;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.bx label{display:block;font-size:.8rem;color:var(--mu);margin-top:12px}
.ts{position:fixed;top:12px;inset-inline:16px;background:var(--ac);color:#fff;padding:12px;border-radius:12px;z-index:30;text-align:center}
.two{display:flex;gap:8px}.two>*{flex:1}
.wr{position:relative;display:flex;gap:8px;justify-content:center;margin:6px 0}.wr:before{content:'';position:absolute;top:40px;height:40px;inset-inline:25%;background:var(--ac2);border-radius:10px}.wc{position:relative;height:120px;width:80px;overflow-y:auto;scroll-snap-type:y mandatory;padding:40px 0;scrollbar-width:none}.wi{height:40px;scroll-snap-align:center;display:grid;place-items:center;font-size:1.2rem}
</style></head><body>
<main id="app"></main><button id="fab" class="fab" data-a="add">＋</button><nav id="nav"></nav>
<div id="sh" class="sh" hidden></div><div id="ts" class="ts" hidden></div><input type="file" id="imp" accept=".json,application/json,text/plain,application/octet-stream" hidden>
<script>if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())document.write('<script src="native.js"><\/script>')</script>
<script>
const $=s=>document.querySelector(s),K='pt2',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const DEFAULT_STATE=()=>({lang:'ar',th:'light',fs:'m',tasks:[],groups:[],cats:[]});
let S=DEFAULT_STATE(),BOOT_RAW=null,BOOT_DATA=null,BOOT_ERROR='',RECOVERY=false,SAVE_FAILED=false,LAST_GOOD_RAW=null;
try{BOOT_RAW=localStorage.getItem(K);if(BOOT_RAW!==null)BOOT_DATA=JSON.parse(BOOT_RAW)}catch(e){BOOT_ERROR=String(e&&e.message||e||'Storage read failed');RECOVERY=true}
if(!RECOVERY&&BOOT_DATA&&typeof BOOT_DATA==='object'&&!Array.isArray(BOOT_DATA))S=Object.assign(DEFAULT_STATE(),BOOT_DATA);
let v='todo',f={tab:'all',cat:'',q:'',open:0},D=null,P={g:null,i:null},ip=null;
const MAX_TASKS=10000,MAX_GROUPS=500,MAX_ITEMS=5000,MAX_LECTURES=50000,MAX_SUBTASKS=50000;
const mig=(s)=>{let generated=0;
 if(!s||!Array.isArray(s.tasks)||!Array.isArray(s.groups))throw new Error('Invalid state shape');
 s.tasks.forEach(x=>{if(!Array.isArray(x.rms))x.rms=Number.isSafeInteger(x.rm)&&x.rm>=0?[x.rm]:[]});
 s.groups.forEach(g=>{if(!g||!Array.isArray(g.it))throw new Error('Invalid section');
  g.it.forEach(i=>{if(!Array.isArray(i.ls)){const n=Number.isSafeInteger(i.done)&&i.done>=0?i.done:0;if(n>5000||generated+n>MAX_LECTURES)throw new Error('Legacy lecture count exceeds safe migration limit');generated+=n;i.ls=[];for(let k=1;k<=n;k++)i.ls.push({id:uid(),n:'محاضرة '+k,at:i.last||Date.now()})}
   i.ls.forEach(l=>{if(!l.id)l.id=uid();if(!Number.isFinite(l.at))l.at=Date.now()});
  });
 });
 return s;
};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
const save=()=>{if(RECOVERY)return false;let ok=false;try{const payload=JSON.stringify(S);localStorage.setItem(K,payload);ok=true;SAVE_FAILED=false;LAST_GOOD_RAW=payload}catch(e){SAVE_FAILED=true;console.error('ENJAZI save failed:',e);if(typeof toast==='function')toast(T('فشل حفظ البيانات! لم يتم تأكيد التغيير. تحقق من مساحة التخزين.','Save failed. The change was not confirmed; check available storage.'))}clearTimeout(save.t);save.t=ok?setTimeout(()=>window.sched&&sched(),300):null;return ok},T=(a,e)=>S.lang==='ar'?a:e,loc=()=>S.lang==='ar'?'ar-EG':'en-GB';
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const due=x=>x.d?new Date(x.d+'T'+(x.tm||'23:59')):null,od=x=>!x.x&&due(x)&&due(x)<new Date();
const pct=(a,b)=>b?Math.round(a/b*100):0,bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const fdt=(d,tm)=>d?new Date(d+'T00:00').toLocaleDateString(loc(),{day:'numeric',month:'short'})+(tm?' '+t12(tm):''):'';
const t12=tm=>{if(!tm)return'--:--';const[h,m]=tm.split(':').map(Number);return(h%12||12)+':'+p2(m)+' '+(h>=12?T('م','PM'):T('ص','AM'))},nk=s=>String(s??'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)),num=s=>parseInt(nk(s))||0,ord=l=>{const m=nk(l.n).match(/\d+/);return m?+m[0]:1e9+l.at/1e3},nx=I=>Math.max(0,...I.ls.map(l=>{const m=nk(l.n).match(/\d+/);return m?+m[0]:0}))+1;
const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=0;setTimeout(()=>t.hidden=1,4000)};
function clock(){const e=$('#clk');if(e)e.textContent=new Date().toLocaleString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function recoveryView(){const raw=BOOT_RAW===null?'':BOOT_RAW;return `<h1>⚠ ${T('حماية البيانات','Data protection')}</h1><div class="card"><b>${T('لم نتمكن من تحميل بياناتك بأمان','Your saved data could not be loaded safely')}</b><p class="mu" style="margin-top:8px">${E(BOOT_ERROR||'تعذر التحقق من بنية البيانات أو ترحيلها.')}</p><p style="margin-top:10px">${T('التطبيق متوقف مؤقتًا عن التعديل حتى لا يستبدل بياناتك ببيانات فارغة. صدّر النسخة الخام أولًا، أو أعد المحاولة.','Editing is paused so the app cannot overwrite your data with an empty state. Export the raw data first, or retry.')}</p></div><button class="btn w" data-recovery="export" ${raw?'':'disabled'}>${T('تصدير البيانات الخام','Export raw data')}</button><button class="btn o w" data-recovery="import">${T('استيراد نسخة احتياطية سليمة','Import a valid backup')}</button><button class="btn o w" data-recovery="retry">${T('إعادة المحاولة','Retry')}</button>${BOOT_RAW!==null?`<button class="btn o w" data-recovery="reset">${T('بدء جديد بعد حفظ نسخة من البيانات القديمة','Start fresh after preserving old data')}</button>`:''}`;}
function render(){const h=document.documentElement;h.lang=S.lang;h.dir=S.lang==='ar'?'rtl':'ltr';h.dataset.th=S.th;h.dataset.fs=S.fs;
if(RECOVERY){$('#app').innerHTML=recoveryView();$('#fab').hidden=true;$('#nav').hidden=true;$('#nav').innerHTML='';$('#sh').hidden=true;return}
$('#nav').hidden=false;$('#app').innerHTML=v==='todo'?todo():v==='track'?track():sets();$('#fab').hidden=v!=='todo';
$('#nav').innerHTML=[['todo','✓',T('المهام','Tasks')],['track','▤',T('الإنجاز','Progress')],['set','⚙',T('الإعدادات','Settings')]].map(([k,i,l])=>`<button class="${v===k?'on':''}" data-a="nv" data-i="${k}">${i}<small>${l}</small></button>`).join('');clock()}
const card=x=>{const s=x.sub||[],sd=s.filter(a=>a.x).length;return `<div class="task${x.x?' dn':''}"><button class="ck p${x.p}" data-a="tg" data-i="${x.id}">${x.x?'✓':''}</button><div class="bd" data-a="ed" data-i="${x.id}"><b>${E(x.t)}</b>${x.n?`<p>${E(x.n)}</p>`:''}<div class="mt">${x.c?`<span class="tag">${E(x.c)}</span>`:''}${x.d?`<span class="${od(x)?'ov':''}">📅 ${fdt(x.d,x.tm)}${x.x?'':' · '+cd(x)}</span>`:''}${(x.rms||[]).length?'<span>🔔</span>':''}${x.rp?'<span>↻</span>':''}${s.length?`<span>☑ ${sd}/${s.length}</span>`:''}${x.lk?'<span>▤</span>':''}</div></div><button class="ic" data-a="del" data-i="${x.id}">✕</button></div>`};
function lst(){const L=S.tasks.filter(x=>(!f.cat||x.c===f.cat)&&(!f.q||(x.t+' '+(x.n||'')).toLowerCase().includes(f.q)));
const act=L.filter(x=>!x.x).sort((a,b)=>(+due(a)||9e15)-(+due(b)||9e15)||b.p-a.p),dne=L.filter(x=>x.x),g={};
(f.tab==='done'?[]:f.tab==='over'?act.filter(od):act).forEach(x=>(g[x.c||T('بدون تصنيف','No category')]??=[]).push(x));
let h=Object.entries(g).map(([c,a])=>`<h3>${E(c)} <span>${a.length}</span></h3>`+a.map(card).join('')).join('');
if(f.tab==='done')h+=dne.map(card).join('');else if(f.tab==='all'&&dne.length)h+=`<div class="cmp"><button data-a="co">${f.open?'▾':'▸'} ${T('منجزة','Completed')} ${dne.length}</button><button class="ov" data-a="clr">${T('مسح','Clear')}</button></div>`+(f.open?dne.map(card).join(''):'');
return h||`<p class="empty">${T('لا توجد مهام هنا. اضغط ＋ لإضافة مهمة.','Nothing here. Tap ＋ to add a task.')}</p>`}
function todo(){const A=S.tasks,dn=A.filter(x=>x.x).length,cats=[...new Set([...S.cats,...A.map(x=>x.c).filter(Boolean)])];
return `<h1>${T('اليوم','Today')}</h1><div class="sub" id="clk"></div><div class="card"><div class="row"><b>${T('تقدم المهام','Tasks progress')}</b><b>${pct(dn,A.length)}%</b></div>${bar(pct(dn,A.length))}<small>${dn} / ${A.length} ${T('منجزة','done')}</small></div>
<div class="two"><input id="qa" class="in" placeholder="⚡ ${T('أضف سريعًا: ذاكر بكرة 5 العصر','Quick add: study tomorrow 5pm')}"><button class="btn" style="flex:none" data-a="qa">＋</button></div><input id="q" class="in" placeholder="🔍 ${T('بحث','Search')}" value="${E(f.q)}"><div class="chips"><button class="chip${f.cat?'':' on'}" data-a="fc" data-i="">${T('الكل','All')}</button>${cats.map(c=>`<button class="chip${f.cat===c?' on':''}" data-a="fc" data-i="${E(c)}">${E(c)}</button>`).join('')}</div>
<div class="tabs">${[['all',T('الكل','All'),A.length],['act',T('نشطة','Active'),A.filter(x=>!x.x).length],['over',T('متأخرة','Overdue'),A.filter(od).length],['done',T('منجزة','Done'),dn]].map(([k,l,n])=>`<button class="${f.tab===k?'on':''}" data-a="tb" data-i="${k}">${l} ${n}</button>`).join('')}</div><div id="lst">${lst()}</div>`}
const dn=i=>i.ls.length,tot=i=>Math.max(i.total||0,i.ls.length),sum=a=>a.reduce((r,i)=>[r[0]+dn(i),r[1]+tot(i)],[0,0]);
const lb=i=>i.total>0?`${dn(i)}/${tot(i)} · ${pct(dn(i),tot(i))}%`:`✓ ${dn(i)} ${T('منجزة','done')}`,ovx=(a,l)=>{const d=a.reduce((r,i)=>r+dn(i),0),k=a.filter(i=>i.total>0),[x,y]=sum(k);return `<div class="card"><div class="row"><b>${l}</b><b>✓ ${d} ${T('منجزة','done')}</b></div>${y?bar(pct(x,y))+`<small>${pct(x,y)}% · ${x}/${y}${k.length<a.length?' ('+T('للمواد المحدد عددها','items with a known total')+')':''}</small>`:`<small>${T('أضف العدد الكلي لتظهر النسبة المئوية','Set a total to see the percentage')}</small>`}</div>`};
const cur=()=>S.groups.find(a=>a.id===P.g).it.find(a=>a.id===P.i),crumb=(...a)=>`<div class="row"><button class="ic" data-a="bk">${S.lang==='ar'?'→':'←'} ${T('رجوع','Back')}</button><small>${a.join(' › ')}</small></div>`;
const ov=(a,b,l)=>`<div class="card"><div class="row"><b>${l}</b><b>${pct(a,b)}%</b></div>${bar(pct(a,b))}<small>${a} / ${b}</small></div>`;
function track(){const G=S.groups.find(a=>a.id===P.g),I=G&&G.it.find(a=>a.id===P.i);
if(I)return crumb(E(G.n),E(I.n))+`<h1>${E(I.n)}</h1>`+ovx([I],T('التقدم في المادة','Subject progress'))+`<div class="ia"><button data-a="et">✎ ${T('العدد الكلي','Total')}</button><button data-a="di">✕ ${T('حذف المادة','Delete')}</button></div>
<h3>${T('سجّل محاضرة أنجزتها','Log a finished lecture')}</h3><div class="two"><input id="nl" class="in" placeholder="${T('فاضي = محاضرة '+nx(I)+' تلقائيًا، أو اكتب أسماء بفاصلة','Empty = Lecture '+nx(I)+' automatically, or type names, comma-separated')}"><button class="btn" style="flex:none" data-a="al">＋ ${T('سجّل','Log')}</button></div>`+
[...I.ls].sort((a,b)=>ord(a)-ord(b)).map(l=>`<div class="task"><button class="ck p1">✓</button><div class="bd" data-a="el" data-i="${l.id}"><b>${E(l.n)}</b><div class="mt"><span>📅 ${new Date(l.at).toLocaleString(loc(),{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div></div><button class="ic" data-a="rl" data-i="${l.id}">✕</button></div>`).join('');
if(G)return crumb(E(G.n))+`<h1>📁 ${E(G.n)}</h1>`+ovx(G.it,T('إنجاز القسم','Section progress'))+G.it.map(i=>`<div class="card" data-a="oi" data-i="${i.id}"><div class="ih"><b>${E(i.n)}</b><span>${lb(i)}</span></div>${i.total>0?bar(pct(dn(i),tot(i))):''}</div>`).join('')+`<button class="btn w" data-a="ai" data-i="${G.id}">＋ ${T('مادة / مشروع جديد','New subject / project')}</button><button class="lnk" data-a="dg" data-i="${G.id}">✕ ${T('حذف القسم','Delete section')}</button>`;
return `<h1>${T('جدول الإنجاز','Progress')}</h1><div class="sub" id="clk"></div>`+ovx(S.groups.flatMap(g=>g.it),T('الإنجاز العام','Overall'))+S.groups.map(g=>{const d=g.it.reduce((r,i)=>r+dn(i),0),[x,y]=sum(g.it.filter(i=>i.total>0));return `<div class="card" data-a="og" data-i="${g.id}"><div class="gh"><h2>📁 ${E(g.n)}</h2><b>${y?pct(x,y)+'%':'✓ '+d}</b></div>${y?bar(pct(x,y)):''}<small>${g.it.length} ${T('مادة / مشروع','items')} · ✓ ${d} ${T('منجزة','done')}</small></div>`}).join('')+`<button class="btn w" data-a="ag">＋ ${T('قسم جديد (مثل: مواد الكلية)','New section (e.g. College)')}</button>`}
const seg=(k,o)=>`<div class="chips">${o.map(([a,l])=>`<button class="chip${S[k]===a?' on':''}" data-a="st" data-k="${k}" data-i="${a}">${l}</button>`).join('')}</div>`;
function sets(){const n='Notification'in window?Notification.permission:'denied';

 if(has(x.sub)&&!(AR(x.sub)&&x.sub.length<=1000&&x.sub.every(a=>R(a)&&text(a.t,1000)&&(!has(a.x)||B(a.x,'boolean')||a.x===0||a.x===1))))return err('المهام الفرعية','subtasks');

}
for(const [i,g] of (o.groups||[]).entries()){

 if(!R(g)||!addId(g.id)||!text(g.n,300)||!g.n.trim()||!AR(g.it))return W(label+' — بيانات القسم أو معرّف مكرر',label+' — invalid section data or duplicate ID');

 for(const [j,it] of g.it.entries()){

  if(!R(it)||!addId(it.id)||!text(it.n,500)||!it.n.trim())return err('بيانات المادة أو معرّف مكرر','invalid item data or duplicate ID');

  if(has(it.done)&&!(Number.isSafeInteger(it.done)&&it.done>=0&&it.done<=5000))return err('عدد المنجز أكبر من حد الترحيل الآمن','completed count exceeds safe migration limit');

   if((it.ls||[]).length>MAX_LECTURES-totalLectures)return err('إجمالي المحاضرات أكبر من الحد الآمن','aggregate lecture count exceeds safe limit');
   totalLectures+=(it.ls||[]).length;
  for(const [k,l] of (it.ls||[]).entries()){
   const lectureLabel=itemLabel+T(' — المحاضرة رقم ',' — lecture #')+(k+1);
   if(!R(l)||!text(l.n,1000)||!l.n.trim())return W(lectureLabel+' — الاسم غير صحيح',lectureLabel+' — invalid name');
   if(has(l.id)&&!addId(l.id))return W(lectureLabel+' — معرّف فارغ أو مكرر',lectureLabel+' — empty or duplicate ID');
   if(has(l.at)&&!stamp(l.at))return W(lectureLabel+' — التاريخ غير صحيح',lectureLabel+' — invalid timestamp');
  }
 }
}
for(const [i,x] of (o.tasks||[]).entries()){
 if(!x.lk)continue;
 const parts=x.lk.split(':');
 if(parts.length!==2||!parts[0]||!parts[1])return W('المهمة رقم '+(i+1)+' — رابط المادة غير صالح','task #'+(i+1)+' — invalid linked item');
 const g=(o.groups||[]).find(a=>a.id===parts[0]);
 if(!g||!g.it.some(a=>a.id===parts[1]))return W('المهمة رقم '+(i+1)+' — المادة المرتبطة غير موجودة','task #'+(i+1)+' — linked item does not exist');
}

};
$('#imp').addEventListener('change',e=>{
 const el=e.target,fl=el.files&&el.files[0];if(!fl)return;
 if(fl.size>10*1024*1024){
  toast(T('حجم ملف النسخة أكبر من 10 ميجابايت','Backup file is larger than 10 MB'));

 }
 const r=new FileReader(),cn=a=>(a.groups||[]).reduce((n,g)=>n+g.it.length,0);
 r.onerror=()=>toast(T('تعذّرت قراءة الملف','Could not read the file'));

 r.onload=()=>{
  let o;
  try{o=JSON.parse(r.result)}
  catch(x){
   return toast(T('الملف ليس نسخة احتياطية صالحة (ملف JSON تالف)','Not a valid backup (broken JSON file)'));
  }

  const er=vld(o);
  if(er)return toast(er);

  if(!confirm(T(
   `سيتم استبدال بياناتك الحالية (${RECOVERY?'غير متاحة':S.tasks.length+' مهمة، '+cn(S)+' مادة'}) ببيانات الملف (${(o.tasks||[]).length} مهمة، ${cn(o)} مادة). هل تريد المتابعة؟`,
   `Your current data (${RECOVERY?'unavailable':S.tasks.length+' tasks, '+cn(S)+' items'}) will be replaced by the file's data (${(o.tasks||[]).length} tasks, ${cn(o)} items). Continue?`
  )))return toast(T('تم الإلغاء — لم تتغيّر بياناتك','Cancelled — your data was not changed'));

  
    let committed=false;

  try{
   clearTimeout(save.t);
   save.t=null;

   const imported=JSON.parse(JSON.stringify(o));
   const next=Object.assign({
    lang:'ar',th:'light',fs:'m',tasks:[],groups:[],cats:[]
   },imported);

   mig(next);

   const postError=vld(next);
   if(postError)return toast(postError);

   const payload=JSON.stringify(next);
   localStorage.setItem(K,payload);

   S=next;
   committed=true;

  }catch(x){
   console.error('ENJAZI import failed:',x);
   return toast(T(
    'فشل الاستيراد — لم يتم اعتماد البيانات الجديدة',
    'Import failed — new data was not committed'
   ));
  }
  if(committed){
   let displayError=false;

   try{render()}
   catch(x){
    displayError=true;
    console.error('ENJAZI render after import failed:',x);
   }

   if(LN)sched();

   if(displayError){
    toast(T(
     'تم حفظ البيانات، لكن حدث خطأ في تحديث العرض. أعد فتح التطبيق.',
     'Data saved, but the display could not refresh. Reopen the app.'
    ));
   }else{
    toast(T(
     `✓ تم الاستيراد: ${S.tasks.length} مهمة، ${cn(S)} مادة`,
     `✓ Imported: ${S.tasks.length} tasks, ${cn(S)} items`
    ));
   }
  }
 };
 r.readAsText(fl);
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='nl')H.al();if(e.target.id==='qa')H.qa()}});const CAP=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()),NP=CAP&&window.NativePlugins||{},LN=NP.LocalNotifications||null;
const hid=s=>{let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return Math.abs(x)%2e9+1};

const cd=x=>{const d=due(x);if(!d)return'';let m=Math.round((d-Date.now())/6e4);const o=m<0;m=Math.abs(m);const t=m>=1440?Math.floor(m/1440)+T(' يوم',' d'):m>=60?Math.floor(m/60)+T(' س',' h')+(m%60?' '+m%60+T(' د',' m'):''):m+T(' د',' m');return o?T('متأخرة ','Overdue ')+t:T('باقي ','in ')+t};
let wl0=0;function wset(){const[h,m]=(D.tm||'09:00').split(':').map(Number);wl0=Date.now()+600;$('#wh').scrollTop=(h%12)*40;$('#wm').scrollTop=m*40;$('#wp').scrollTop=h>=12?40:0}

function nlp(s){s=s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));const now=new Date();let d=new Date(),dt='',tm='',m;const cut=r=>{const k=s.match(r);if(k)s=s.replace(k[0],' ');return k},hm=(h,i)=>p2(h)+':'+p2(i||0);
if(m=cut(/(?:بعد|in)\s*(\d+)\s*(ساع\S*|دقيق\S*|دقائق|يوم|أيام|ايام|hours?|mins?|minutes?|days?)/i)){const u=m[2],k=/ساع|hour/i.test(u)?36e5:/دق|min/i.test(u)?6e4:864e5;d=new Date(+now+ +m[1]*k);dt=iso(d);if(k<864e5)tm=hm(d.getHours(),d.getMinutes())}
else{if(cut(/بعد\s*(بكرة|بكره|غد)/)){d.setDate(d.getDate()+2);dt=iso(d)}else if(cut(/بكرة|بكره|غدا|غداً|tomorrow/i)){d.setDate(d.getDate()+1);dt=iso(d)}else if(cut(/الليلة|tonight/i)){dt=iso(d);tm='20:00'}else if(cut(/النهاردة|النهارده|اليوم|today/i))dt=iso(d);else if(cut(/(?:الأسبوع|الاسبوع|اسبوع)\s*(?:الجاي|الجاى|القادم)|next week/i)){d.setDate(d.getDate()+7);dt=iso(d)}
const P=/عصر|مغرب|مساء|ليل|عشاء|pm/i,A=/صباح|صبح|فجر|am/i,Z=/ظهر|ضهر/i,fx=(h,p)=>P.test(p)?(h<12?h+12:h):A.test(p)?(h===12?0:h):Z.test(p)?(h<7?h+12:h):h;
if(m=cut(/(?:(?:الساعة|الساعه|at)\s*)?(\d{1,2})(?::(\d{2}))?\s*(صباح\S*|الصبح|الفجر|الظهر|الضهر|ظهر\S*|عصر\S*|العصر|المغرب|مغرب|مساء\S*|بالليل|الليل|العشاء|pm|am)/i))tm=hm(fx(+m[1],m[3]),+m[2]);else if(m=cut(/(?:الساعة|الساعه|at)\s*(\d{1,2})(?::(\d{2}))?/i))tm=hm(+m[1],+m[2]);else if(m=cut(/(\d{1,2}):(\d{2})/))tm=hm(+m[1],+m[2])}
const t=s.replace(/\s+/g,' ').trim();if(!t)return null;if(tm&&!dt){d=new Date();const[h,i]=tm.split(':').map(Number);d.setHours(h,i,0,0);if(d<now)d.setDate(d.getDate()+1);dt=iso(d)}
return{id:uid(),t,n:'',d:dt,tm,rms:tm?[0]:[],rp:'',p:2,c:'',pin:true,sub:[],lk:'',x:0}}
async function sched(){if(!LN||RECOVERY)return;try{
const now=Date.now(),N=[],want=new Set(),gone=new Set(S.pin||[]);
S.tasks.forEach(x=>{const ex={tid:x.id};if(x.x){gone.add(hid('p'+x.id));gone.add(hid(x.id+'|s'));(x.rms||[]).forEach(r=>gone.add(hid(x.id+'|'+r)));return}const d=due(x);

async function initN(){if(!LN||RECOVERY)return;try{await LN.requestPermissions();await LN.createChannel({id:'rem',name:T('تذكيرات المهام','Task reminders'),importance:5,vibration:true});await LN.createChannel({id:'pin',name:T('مهام ثابتة','Pinned tasks'),importance:2});
